# Setzt bei jedem Push auf main automatisch eine neue Versionsnummer für Codex und Cursor.
# Claude braucht keine: ohne "version" in .claude-plugin/plugin.json gilt jeder Commit als Update.
name: Version
on:
  push:
    branches: [main]
    paths-ignore: [".codex-plugin/plugin.json", ".cursor-plugin/plugin.json"]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version setzen
        run: |
          V="1.0.${{ github.run_number }}"
          for f in .codex-plugin/plugin.json .cursor-plugin/plugin.json; do
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('$f'));j.version='$V';fs.writeFileSync('$f',JSON.stringify(j,null,2)+'\n')"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $V" && git push || echo "nichts zu tun"
